<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kindred — raw test client</title>
    <style>
      body { font-family: ui-monospace, monospace; margin: 1rem; max-width: 720px; }
      input, button { font: inherit; padding: 0.4rem; margin: 0.2rem 0; }
      #log { white-space: pre-wrap; background: #111; color: #0f0; padding: 0.6rem;
             height: 320px; overflow: auto; border-radius: 6px; }
      .row { display: flex; gap: 0.4rem; flex-wrap: wrap; }
    </style>
  </head>
  <body>
    <h1>Kindred raw test client</h1>
    <p>Minimal client to confirm <code>/ws</code> and state broadcasts work.</p>
    <div class="row">
      <input id="code" placeholder="CODE (ABCD)" value="ABCD" />
      <input id="name" placeholder="name" value="Tester" />
      <button id="connect">Connect</button>
    </div>
    <div class="row">
      <button data-msg='{"type":"join","name":"Tester"}'>join</button>
      <button data-msg='{"type":"startRound","prompt":"Rank these","cards":[{"id":"a","type":"emoji","emoji":"🍕","label":"A"},{"id":"b","type":"emoji","emoji":"🍔","label":"B"},{"id":"c","type":"emoji","emoji":"🌮","label":"C"},{"id":"d","type":"emoji","emoji":"🍣","label":"D"},{"id":"e","type":"emoji","emoji":"🥗","label":"E"}]}'>startRound</button>
      <button data-msg='{"type":"lockIn","order":["a","b","c","d","e"]}'>lockIn</button>
      <button data-msg='{"type":"nextRound"}'>nextRound</button>
      <button data-msg='{"type":"endGame"}'>endGame</button>
    </div>
    <div id="log"></div>

    <script>
      let ws;
      const log = (m) => {
        const el = document.getElementById("log");
        el.textContent += m + "\n";
        el.scrollTop = el.scrollHeight;
      };
      document.getElementById("connect").onclick = () => {
        const code = document.getElementById("code").value.trim();
        const name = document.getElementById("name").value.trim();
        ws = new WebSocket(
          `ws://localhost:8080/ws?code=${code}&name=${encodeURIComponent(name)}`
        );
        ws.onopen = () => log("OPEN");
        ws.onclose = () => log("CLOSE");
        ws.onerror = () => log("ERROR");
        ws.onmessage = (e) => log("<- " + e.data);
      };
      document.querySelectorAll("button[data-msg]").forEach((b) => {
        b.onclick = () => {
          if (!ws || ws.readyState !== WebSocket.OPEN) return log("not connected");
          log("-> " + b.dataset.msg);
          ws.send(b.dataset.msg);
        };
      });
    </script>
  </body>
</html>
